      <a class="pri" href="#rsvp" data-t="ui.rsvp_dock">RSVP</a>

      <button type="button" data-music data-aria="ui.music_aria" aria-label="Play music"><span class="kit-eq"><i></i><i></i><i></i></span><span data-t="ui.music">Music</span></button>

    <script src="./js/kit.js"></script>
    <script src="./js/open.js"></script>
    <script src="./js/wed.js"></script>
    <script>
      (function(){
        var K=DSIKit, Wed=DSIWed, W=K.W, $=K.$, esc=K.esc;
        var TINTS=["#FFE1EA","#E2F0FF","#FFF3C9","#DDF6EC","#EDE6FF","#FFE6D6"];
        var BAL=["#F7A8BC","#8EC5FF","#FFD166","#9FE3C6","#C8B6FF","#FFB38A"];
        Wed.page({ scratch:{ material:"confetti" },  music:"musicbox" });

        var FALLBACK_PHOTO="./images/Mahi-turns-1.jpeg";
        function photosFor(m,idx){
          var raw=(m.photos||[]).slice();
          while(raw.length<12){
            raw.push("./images/months/"+(idx+1)+"/"+(raw.length+1)+".jpg");
          }
          return raw.slice(0,12).map(function(p,n){
            var src=typeof p==="string"?p:(p&&p.image)||FALLBACK_PHOTO;
            var cap=(p&&typeof p==="object"&&p.caption)||(m.title+" · "+(n+1));
            return {image:src,caption:cap};
          });
        }
        K.list($("#months"),(W.year||{}).months,function(m,i){
          return '<button type="button" class="mo rv" data-mo="'+i+'" style="--t:'+TINTS[i%6]+'" aria-label="'+esc(m.month+": "+m.title)+'"><small>'+esc(m.month)+'</small><i>'+esc(m.icon)+'</i><b>'+esc(m.title)+'</b></button>';
        });
        (function(){
          var modal=$("#monthModal"), gal=$("#monthGal"), closer=$("#monthModalClose");
          var lastBtn=null, lastOverflow="", items=[];
          function closeMonth(){
            if(!modal.classList.contains("on")) return;
            modal.classList.remove("on");
            document.documentElement.style.overflow=lastOverflow;
            setTimeout(function(){ modal.hidden=true; gal.innerHTML=""; },220);
            if(lastBtn) lastBtn.focus();
          }
          function openMonth(idx,btn){
            var months=(W.year||{}).months||[];
            var m=months[idx]; if(!m) return;
            lastBtn=btn||null;
            items=photosFor(m,idx);
            $("#monthModalKicker").textContent=m.month||"";
            $("#monthModalTitle").textContent=m.title||"";
            gal.innerHTML=items.map(function(g,i){
              return '<button type="button" class="kg-i" data-kg="'+i+'" aria-label="'+esc(g.caption||("Photo "+(i+1)))+'">'+
                '<img src="'+esc(g.image)+'" alt="'+esc(g.caption||"")+'" loading="lazy" decoding="async"></button>';
            }).join("");
            K.$$("img",gal).forEach(function(im,i){
              im.addEventListener("error",function(){
                if(im.dataset.fb) return;
                im.dataset.fb="1";
                items[i].image=FALLBACK_PHOTO;
                im.src=FALLBACK_PHOTO;
              });
            });
            lastOverflow=document.documentElement.style.overflow;
            document.documentElement.style.overflow="hidden";
            modal.hidden=false;
            requestAnimationFrame(function(){ modal.classList.add("on"); closer.focus(); });
          }
          $("#months").addEventListener("click",function(e){
            var btn=e.target.closest("[data-mo]");
            if(btn) openMonth(+btn.dataset.mo,btn);
          });
          gal.addEventListener("click",function(e){
            var b=e.target.closest("[data-kg]");
            if(b) K.lightbox(items,+b.dataset.kg);
          });
          closer.addEventListener("click",closeMonth);
          modal.addEventListener("click",function(e){ if(e.target===modal) closeMonth(); });
          document.addEventListener("keydown",function(e){
            if(e.key==="Escape" && modal.classList.contains("on") && !document.querySelector(".kg-lb")) closeMonth();
          });
        })();
        K.list($("#planList"),(W.plan||{}).items,function(p,i){
          return '<li class="rv" style="--c:'+BAL[i%6]+'"><i>'+esc(p.icon)+'</i><div><time>'+esc(p.time)+'</time><h3>'+esc(p.title)+'</h3><p>'+K.nl(p.text)+'</p></div></li>';
        });
        K.list($("#corners"),(W.fun||{}).items,function(c,i){
          return '<article class="corner rv" style="--t:'+TINTS[i%6]+';--c:'+BAL[i%6]+'"><i>'+esc(c.icon)+'</i><h3>'+esc(c.title)+'</h3><p>'+K.nl(c.text)+'</p></article>';
        });

        var WS=W.wishes||{}, wall=$("#wishWall"), wn=0;
        function wish(w,fresh){
          var c=BAL[wn++%6];
          return '<div class="wb'+(fresh?' new':'')+'" style="--c:'+c+';--r:'+((wn*29%11)-5)+'deg"><i class="b"></i><i class="s"></i><div class="tag"><span>'+esc(w.text)+'</span><em>'+esc(w.by||"")+'</em></div></div>';
        }
        wall.innerHTML=(WS.seed||[]).map(function(w){ return wish(w); }).join("");
        $("#wishForm").addEventListener("submit",function(e){
          e.preventDefault();
          var t=$("#wishText").value.trim(), n=$("#wishName").value.trim(); if(!t) return;
          wall.insertAdjacentHTML("afterbegin",wish({text:t,by:n},true));
          $("#wishText").value=""; K.sfx("chime"); K.toast(WS.added||"Your wish is floating!");
        });

        /* ==== opening ==== */
        Wed.ritual(function(O){
          var fx=O.fx($("#opFx"),{kind:"confetti",colors:BAL.concat(["#FFFFFF"]),rain:0,max:320,r:4.4,fall:.9});
          O.taps(K.$$("#popSky .bal"),{delay:500,
            onTap:function(i,el){
              var c=O.center(el), col=getComputedStyle(el).getPropertyValue("--c").trim();
              K.sfx("stamp"); fx.burst(34,c[0],c[1],{explode:true,speed:5,r:4,life:130,colors:[col,"#FFFFFF",col]});
            },
            onDone:function(){ fx.burst(160,innerWidth/2,innerHeight*.4,{explode:true,speed:8,r:4.5,life:220}); fx.rain(.25); K.sfx("chime"); O.complete(); }});
        });
        /* ==== /opening ==== */
      })();
    </script>
